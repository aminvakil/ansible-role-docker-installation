---
- name: Include CentOS 7
  include_tasks: centos7.yml
  when: ansible_facts["distribution"] == 'CentOS' and ansible_facts["distribution_major_version"] == '7'

- name: Include CentOS 8
  include_tasks: centos8.yml
  when: ansible_facts["distribution"] in ['CentOS', 'Rocky'] and ansible_facts["distribution_major_version"] == '8'

- name: Include Fedora
  include_tasks: fedora.yml
  when: ansible_facts["distribution"] == 'Fedora'

- name: Include Debian
  include_tasks: debian.yml
  when: ansible_facts["distribution"] == 'Debian'

- name: Include Ubuntu
  include_tasks: ubuntu.yml
  when: ansible_facts["distribution"] == 'Ubuntu'

- name: Ensure Docker compatibility in nested/containerized environments
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "features": {
          "containerd-snapshotter": false
        }
      }
    owner: root
    group: root
    mode: '0644'
  when: ansible_facts["virtualization_type"] in ['docker', 'lxc', 'container', 'containerd']
  notify: restart docker

- name: Run all handlers
  meta: flush_handlers

- name: Check docker works correctly
  command: docker run --rm hello-world
  changed_when: false
